<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Query · EDM-Werkzeuge · DDBpro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="./code-view.css" rel="stylesheet">
    <link href="./source.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom" aria-label="Werkzeuge">
        <div class="container-fluid px-3 px-lg-4">
            <a class="navbar-brand d-flex align-items-center gap-3" href="./">
                <img class="d-none d-sm-block object-fit-contain flex-shrink-0" src="./images/ddbpro.svg" width="115" height="32" alt="DDBpro">
                <img class="d-block d-sm-none object-fit-contain flex-shrink-0" src="./images/ddb-signet.svg" width="32" height="32" alt="DDBpro">
                <span class="fs-6 fw-semibold text-body">EDM-Werkzeuge</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Navigation öffnen"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav nav-pills gap-1 me-auto mb-2 mb-lg-0" style="--bs-nav-pills-link-active-bg: #a5003b;">
                    <li class="nav-item"><a class="nav-link px-3" href="./explorer.html">Explorer</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="./">Validierung</a></li>
                    <li class="nav-item"><a class="nav-link px-3 active text-white fw-semibold" href="./query.html" aria-current="page">Query</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="./converter.html">Konverter</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main id="mainContent" class="container-fluid px-3 px-lg-4 py-4 w-100">
        <header class="mb-4">
            <h1 id="queryHeading" class="h3 mb-1">Query</h1>
            <p class="text-body-secondary mb-0">Die RDF/XML-Eingabe mit XPath oder SPARQL direkt im Browser abfragen.</p>
        </header>
        <section id="rdfSource" class="mb-4" aria-label="Gemeinsame RDF-Eingabe"></section>
        <section id="pageMessages" class="sticky-top" aria-label="Meldungen">
            <div id="result" class="d-none" role="status" aria-live="polite" aria-atomic="true"></div>
        </section>
        <section id="queryWorkspace" class="w-100" aria-labelledby="queryHeading">
            <div class="card">
                <div class="card-body p-3 p-md-4">
                    <ul class="nav nav-tabs mb-3" role="tablist" aria-label="Abfragesprache">
                        <li class="nav-item" role="presentation"><button id="sparqlTab" type="button" class="nav-link active" role="tab" aria-selected="true" aria-controls="paneSparql" data-query-mode="sparql">SPARQL</button></li>
                        <li class="nav-item" role="presentation"><button id="xpathTab" type="button" class="nav-link" role="tab" aria-selected="false" aria-controls="paneXPath" data-query-mode="xpath" tabindex="-1">XPath</button></li>
                    </ul>
                    <div id="paneSparql" role="tabpanel" aria-labelledby="sparqlTab">
                        <div class="row g-4">
                            <div class="col-12 col-lg-5">
                                <label for="sparqlQueryInput" class="form-label">Abfrage</label>
                                <textarea id="sparqlQueryInput" class="source-code form-control font-monospace mb-2" spellcheck="false" rows="14" placeholder="SPARQL-Abfrage eingeben oder ein Beispiel laden"></textarea>
                                <div class="d-flex flex-wrap gap-2">
                                    <button type="button" id="runSparqlBtn" class="btn btn-primary">Ausführen</button>
                                    <button type="button" id="loadSparqlExample1Btn" class="btn btn-outline-secondary" title="Ortsbezeichnungen">Beispiel 1</button>
                                    <button type="button" id="loadSparqlExample2Btn" class="btn btn-outline-secondary" title="RDF/XML → Portal-JSON">Beispiel 2</button>
                                </div>
                            </div>
                            <div class="col-12 col-lg-7">
                                <h2 id="sparqlResultHeading" class="h6 mb-2">JSON-Ergebnis</h2>
                                <p id="sparqlState" class="small text-body-secondary mb-2" role="status" aria-live="polite">Noch keine Abfrage ausgeführt.</p>
                                <p id="sparqlMetrics" class="small text-body-secondary mb-2 d-none"></p>
                                <div id="sparqlQueryResult" class="d-none" role="region" aria-labelledby="sparqlResultHeading"></div>
                            </div>
                        </div>
                    </div>
                    <div id="paneXPath" class="d-none" role="tabpanel" aria-labelledby="xpathTab">
                        <div class="row g-4">
                            <div class="col-12 col-lg-5">
                                <label for="xpathQueryInput" class="form-label">Abfrage</label>
                                <textarea id="xpathQueryInput" class="source-code form-control font-monospace mb-2" spellcheck="false" rows="10"></textarea>
                                <div class="d-flex flex-wrap gap-2">
                                    <button type="button" id="runXPathBtn" class="btn btn-primary">Ausführen</button>
                                    <button type="button" id="loadXPathExampleBtn" class="btn btn-outline-secondary">Beispiel laden</button>
                                </div>
                            </div>
                            <div class="col-12 col-lg-7">
                                <h2 class="h6 mb-2">Ergebnis</h2>
                                <div id="xpathQueryResult" class="border rounded bg-body-tertiary p-3 small text-break" role="status" aria-live="polite">Noch keine Abfrage ausgeführt.</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="./messages.js"></script>
    <script src="./vendor/prism-core-1.29.0.min.js" data-manual></script>
    <script src="./vendor/prism-markup-1.29.0.min.js"></script>
    <script src="./vendor/prism-json-1.29.0.min.js"></script>
    <script src="./code-view.js"></script>
    <script src="./rdf-source.js"></script>
    <script src="./sparql-client.js"></script>
    <script src="./query.js"></script>
</body>
</html>
