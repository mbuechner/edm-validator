<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Validierung · EDM-Werkzeuge · DDBpro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="./app.css" rel="stylesheet">
    <link href="./code-view.css" rel="stylesheet">
    <link href="./source.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom" aria-label="Werkzeuge">
        <div class="container-fluid px-3 px-lg-4">
            <a class="navbar-brand d-flex align-items-center gap-3" href="./">
                <picture>
                    <source media="(max-width: 575.98px)" srcset="./images/ddb-signet.svg">
                    <img class="app-brand-logo" src="./images/ddbpro.svg" width="306" height="85" alt="DDBpro">
                </picture>
                <span class="app-brand-title">EDM-Werkzeuge</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Navigation öffnen"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="./explorer.html">Explorer</a></li>
                    <li class="nav-item"><a class="nav-link active" href="./" aria-current="page">Validierung</a></li>
                    <li class="nav-item"><a class="nav-link" href="./query.html">Query</a></li>
                    <li class="nav-item"><a class="nav-link" href="./converter.html">Konverter</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main id="mainContent" class="container-fluid px-3 px-lg-4 py-4 w-100">
        <header class="mb-4">
            <h1 id="validatorHeading" class="h3 mb-1">Validierung</h1>
            <p class="text-body-secondary mb-0">Die RDF/XML-Eingabe auf XML-Syntax, EDM-Schema, RDF-Syntax und SHACL-Regeln prüfen.</p>
        </header>
        <section id="rdfSource" class="mb-4" aria-label="Gemeinsame RDF-Eingabe"></section>
        <section id="pageMessages" class="sticky-top" aria-label="Meldungen">
            <div id="result" class="d-none" role="status" aria-live="polite" aria-atomic="true"></div>
        </section>
        <section id="validatorWorkspace" class="w-100" aria-labelledby="validatorHeading">
            <form id="validationForm" class="mb-4">
                <button type="submit" class="btn btn-primary">Validierung starten</button>
            </form>
            <div id="checklist" class="mt-3 d-none">
                <h2 class="h6 mb-2">Prüfschritte</h2>
                <ul id="checklistItems" class="list-group"></ul>
            </div>
            <details id="details" class="card mt-3 d-none">
                <summary class="card-header fw-semibold">Prüfdetails</summary>
                <div class="card-body">
                    <ul class="list-group list-group-flush" id="resultList"></ul>
                </div>
            </details>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="./messages.js"></script>
    <script src="./vendor/prism-core-1.29.0.min.js" data-manual></script>
    <script src="./vendor/prism-markup-1.29.0.min.js"></script>
    <script src="./vendor/prism-json-1.29.0.min.js"></script>
    <script src="./code-view.js"></script>
    <script src="./rdf-source.js"></script>
    <script src="./validation.js"></script>
</body>
</html>
