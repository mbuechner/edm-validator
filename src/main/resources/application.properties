spring.application.name=edm-validator
server.servlet.context-path=${APP_BASE_PATH:/app/edm-validator}

# Compress text assets and large RDF/JSON responses; binary fonts are already compressed.
server.compression.enabled=true
server.compression.min-response-size=2KB
server.compression.mime-types=application/json,application/javascript,text/javascript,text/css,text/html,text/plain,application/xml,text/xml,application/rdf+xml,image/svg+xml
