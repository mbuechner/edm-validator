spring.application.name=edm-validator
server.servlet.context-path=${APP_BASE_PATH:/app/edm-validator}

# Compress text assets, WebAssembly and large RDF/JSON; fonts are already compressed.
server.compression.enabled=true
server.compression.min-response-size=2KB
server.compression.mime-types=application/json,application/javascript,text/javascript,text/css,text/html,text/plain,application/xml,text/xml,application/rdf+xml,application/sparql-query,image/svg+xml,application/wasm
