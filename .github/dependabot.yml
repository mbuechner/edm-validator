version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    allow:
      - dependency-name: '*'
        update-types: [version-update:semver-minor, version-update:semver-patch]
    groups:
      maven-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    allow:
      - dependency-name: '*'
        update-types: [version-update:semver-minor, version-update:semver-patch]
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/check-container
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    allow:
      - dependency-name: '*'
        update-types: [version-update:semver-minor, version-update:semver-patch]
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: amazoncorretto
        versions: ['>= 26']
      # The daily digest check tracks updates to the Maven 3 / Java 25 tag.
      - dependency-name: maven
    groups:
      docker-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
